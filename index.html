<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Slot Mechanics — Catalog</title>
<meta name="description" content="Art-first catalog of how real slots work — grids, win systems, tumbles, free spins, and feature buys."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  color-scheme: dark;
  --bg: #090a0d;
  --raised: #12141b;
  --raised-2: #181b24;
  --raised-3: #1e222d;
  --line: rgba(255,255,255,0.08);
  --line-2: rgba(255,255,255,0.14);
  --text: #f3f4f6;
  --muted: #9aa3b5;
  --faint: #6b7385;
  --accent: #d4a24c;
  --accent-soft: rgba(212,162,76,0.14);
  --accent-text: #f0c878;
  --high: #3ecf8e;
  --high-bg: rgba(62,207,142,0.12);
  --med: #e0b44c;
  --med-bg: rgba(224,180,76,0.12);
  --low: #f07178;
  --low-bg: rgba(240,113,120,0.12);
  --shadow: 0 18px 40px rgba(0,0,0,0.45);
  --display: "Fraunces", ui-serif, Georgia, serif;
  --sans: "Figtree", ui-sans-serif, system-ui, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 14px;
  --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--sans);
  background:
    radial-gradient(1000px 480px at 12% -8%, rgba(212,162,76,0.10), transparent 55%),
    radial-gradient(800px 420px at 100% 0%, rgba(62,207,142,0.04), transparent 48%),
    var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(212,162,76,0.35); color: #fff; }
:focus-visible { outline: none; box-shadow: var(--focus); }

.app { min-height: 100vh; display: grid; grid-template-rows: auto auto 1fr; }

.top {
  padding: 1.35rem 1.5rem 1rem;
  max-width: 1440px;
  margin: 0 auto;
  width: 100%;
}
.top-row {
  display: flex; flex-wrap: wrap; justify-content: space-between;
  gap: 1rem; align-items: flex-end;
}
.brand h1 {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(1.85rem, 3.2vw, 2.55rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.05;
}
.brand p {
  margin: 0.45rem 0 0;
  max-width: 46ch;
  color: var(--muted);
  font-size: 0.98rem;
}
.top-actions { display: flex; gap: 0.5rem; align-items: center; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  height: 38px; padding: 0 0.95rem; border-radius: 999px;
  border: 1px solid var(--line-2); background: var(--raised);
  color: var(--text); text-decoration: none;
  font-size: 0.88rem; font-weight: 600; cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.btn:hover { background: var(--raised-2); border-color: rgba(255,255,255,0.22); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1205; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.sm { height: 32px; padding: 0 0.75rem; font-size: 0.8rem; }

.stats {
  display: flex; flex-wrap: wrap; gap: 0.55rem 1.1rem;
  margin-top: 1.1rem; color: var(--muted); font-size: 0.88rem;
}
.stats strong { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

.controls {
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(14px);
  background: rgba(9,10,13,0.86);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.controls-inner {
  max-width: 1440px; margin: 0 auto; padding: 0.75rem 1.5rem;
  display: grid; gap: 0.65rem;
}
.search-row {
  display: grid; grid-template-columns: 1fr auto auto auto; gap: 0.5rem;
}
@media (max-width: 820px) {
  .search-row { grid-template-columns: 1fr 1fr; }
  .search-row .search { grid-column: 1 / -1; }
}
.field, .select {
  height: 40px; border-radius: 12px; border: 1px solid var(--line-2);
  background: var(--raised); color: var(--text);
  font: 600 0.92rem/1 var(--sans); padding: 0 0.85rem;
}
.field { width: 100%; }
.field::placeholder { color: var(--faint); font-weight: 500; }
.select { cursor: pointer; }
.providers { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chip {
  height: 32px; padding: 0 0.75rem; border-radius: 999px;
  border: 1px solid var(--line-2); background: transparent;
  color: var(--muted); font: 600 0.8rem/1 var(--sans);
  cursor: pointer; transition: .15s ease;
}
.chip:hover { color: var(--text); border-color: rgba(255,255,255,0.25); }
.chip.on {
  background: var(--accent-soft);
  border-color: rgba(212,162,76,0.45);
  color: var(--accent-text);
}

.stage {
  max-width: 1440px; margin: 0 auto; width: 100%;
  padding: 1.1rem 1.5rem 2.5rem;
  display: grid; grid-template-columns: 1fr; gap: 1rem; min-height: 0;
}
.stage.split { grid-template-columns: minmax(0, 1fr) minmax(360px, 440px); }
@media (max-width: 1040px) {
  .stage.split { grid-template-columns: 1fr; }
  .dossier { position: relative !important; top: auto !important; max-height: none !important; }
}

.catalog-meta {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 0.85rem; color: var(--muted); font-size: 0.86rem;
}
.catalog-meta strong { color: var(--text); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 0.85rem;
}

/* Art-first tile */
.card {
  position: relative;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--raised);
  border-radius: var(--radius);
  padding: 0;
  color: inherit;
  cursor: pointer;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.card:hover {
  transform: translateY(-3px);
  border-color: rgba(212,162,76,0.4);
  box-shadow: var(--shadow);
}
.card.active {
  border-color: rgba(212,162,76,0.65);
  box-shadow: 0 0 0 1px rgba(212,162,76,0.3), var(--shadow);
}
.card-art {
  position: relative;
  aspect-ratio: 16 / 10;
  background:
    linear-gradient(145deg, #1a1e28, #0e1016 60%);
  overflow: hidden;
}
.card-art img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .35s ease;
}
.card:hover .card-art img { transform: scale(1.04); }
.card-art .ph {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  color: var(--faint);
  font-family: var(--display);
  font-size: 1.4rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  background:
    radial-gradient(circle at 30% 20%, rgba(212,162,76,0.12), transparent 50%),
    linear-gradient(160deg, #1c2030, #0c0e14);
}
.card-art .badge {
  position: absolute; top: 0.45rem; right: 0.45rem;
  backdrop-filter: blur(8px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.35);
}
.card-body {
  padding: 0.7rem 0.75rem 0.8rem;
  display: grid; gap: 0.35rem;
  background: linear-gradient(180deg, var(--raised-2), var(--raised));
  flex: 1;
}
.card-title {
  font-family: var(--display);
  font-size: 0.98rem;
  font-weight: 650;
  letter-spacing: -0.02em;
  line-height: 1.2;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-provider {
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 650;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.tags { display: flex; flex-wrap: wrap; gap: 0.28rem; margin-top: 0.15rem; }
.tag {
  font-size: 0.68rem; font-weight: 650; color: #c6cddc;
  background: rgba(255,255,255,0.04); border: 1px solid var(--line);
  border-radius: 999px; padding: 0.14rem 0.42rem;
}

.badge {
  display: inline-flex; align-items: center;
  font-size: 0.62rem; font-weight: 750;
  letter-spacing: 0.04em; text-transform: uppercase;
  border-radius: 999px; padding: 0.2rem 0.45rem; flex: 0 0 auto;
}
.badge.high { color: var(--high); background: var(--high-bg); }
.badge.medium { color: var(--med); background: var(--med-bg); }
.badge.low { color: var(--low); background: var(--low-bg); }

.empty { padding: 3rem 1rem; text-align: center; color: var(--muted); }
.err { color: var(--low); }

/* Dossier */
.dossier {
  position: sticky; top: 84px; align-self: start;
  max-height: calc(100vh - 100px); overflow: auto;
  background: var(--raised); border: 1px solid var(--line-2);
  border-radius: 18px; box-shadow: var(--shadow);
  scrollbar-width: thin; scrollbar-color: #3a4050 transparent;
}
.dossier-inner { padding: 0 0 1.5rem; }
.dossier-hero {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #0c0e14;
  border-radius: 18px 18px 0 0;
  overflow: hidden;
}
.dossier-hero img {
  width: 100%; height: 100%; object-fit: cover; display: block;
}
.dossier-hero .ph {
  position: absolute; inset: 0; display: grid; place-items: center;
  color: var(--faint); font-family: var(--display); font-size: 2rem; font-weight: 600;
}
.dossier-head {
  display: grid; gap: 0.75rem;
  padding: 1.05rem 1.15rem 1rem;
  border-bottom: 1px solid var(--line);
  margin-bottom: 1rem;
}
.dossier-title {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(1.45rem, 2.2vw, 1.9rem);
  font-weight: 700; letter-spacing: -0.03em; line-height: 1.1;
}
.dossier-meta {
  display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center;
  color: var(--muted); font-size: 0.88rem;
}
.slug { font-family: var(--mono); font-size: 0.72rem; color: var(--faint); }
.dossier-actions { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0 1.15rem; margin-bottom: 1rem; }
.dossier-pad { padding: 0 1.15rem; }

.glance {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem;
  margin-bottom: 1.1rem;
}
.glance-item {
  background: var(--raised-2); border: 1px solid var(--line);
  border-radius: 14px; padding: 0.75rem 0.8rem;
}
.glance-item .lab {
  font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--faint); margin-bottom: 0.25rem;
}
.glance-item .val {
  font-family: var(--display); font-size: 1.05rem; font-weight: 650; letter-spacing: -0.02em;
}
.glance-item .hint { margin-top: 0.15rem; font-size: 0.78rem; color: var(--muted); }

.tabs {
  display: flex; gap: 0.25rem; padding: 0.2rem;
  background: var(--raised-2); border-radius: 12px;
  margin-bottom: 1rem; border: 1px solid var(--line);
}
.tab {
  flex: 1; height: 34px; border: 0; border-radius: 9px;
  background: transparent; color: var(--muted);
  font: 650 0.8rem/1 var(--sans); cursor: pointer;
}
.tab.on {
  background: var(--raised-3); color: var(--text);
  box-shadow: 0 1px 0 rgba(255,255,255,0.04);
}

.section { margin: 0 0 1.05rem; }
.section h3 {
  margin: 0 0 0.5rem; font-size: 0.72rem; font-weight: 750;
  letter-spacing: 0.07em; text-transform: uppercase; color: var(--faint);
  display: flex; gap: 0.4rem; align-items: center;
}
.prose { margin: 0; white-space: pre-wrap; color: #d5dae6; font-size: 0.92rem; line-height: 1.55; }
.quote {
  margin: 0; padding: 0.75rem 0.8rem; background: #0d0f14;
  border: 1px solid var(--line); border-radius: 12px;
  font-family: var(--mono); font-size: 0.74rem; line-height: 1.5;
  color: #c5ccdb; white-space: pre-wrap; max-height: 220px; overflow: auto;
}
.sym { padding: 0.7rem 0; border-top: 1px solid var(--line); }
.sym:first-of-type { border-top: 0; padding-top: 0; }
.sym .name {
  font-family: var(--display); font-weight: 650; letter-spacing: -0.02em; margin-bottom: 0.25rem;
}

.feat-card, .mode-card, .buy-card, .kv-card {
  background: var(--raised-2); border: 1px solid var(--line);
  border-radius: 14px; padding: 0.85rem 0.95rem; margin: 0 0 0.65rem;
}
.feat-card .name, .mode-card .name, .buy-card .name {
  font-family: var(--display); font-weight: 650; letter-spacing: -0.02em;
  font-size: 1.02rem; margin-bottom: 0.45rem;
}
.kv-grid {
  display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.35rem 0.75rem;
  margin: 0 0 0.55rem;
}
.kv-grid .k {
  font-size: 0.68rem; font-weight: 750; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--faint); padding-top: 0.15rem;
}
.kv-grid .v { font-size: 0.9rem; color: #d5dae6; line-height: 1.45; white-space: pre-wrap; }
.phase-list { margin: 0; padding: 0; list-style: none; }
.phase-list li {
  position: relative; padding: 0.55rem 0 0.55rem 1.55rem;
  border-top: 1px solid var(--line); font-size: 0.9rem; color: #d5dae6; line-height: 1.45;
}
.phase-list li:first-child { border-top: 0; }
.phase-list li::before {
  content: attr(data-n); position: absolute; left: 0; top: 0.55rem;
  width: 1.15rem; height: 1.15rem; border-radius: 999px;
  background: rgba(212,162,76,0.15); color: var(--accent);
  font: 750 0.65rem/1.15rem var(--sans); text-align: center;
}
.pill-row { display: flex; flex-wrap: wrap; gap: 0.3rem; margin: 0.35rem 0 0.15rem; }
.mini-pill {
  border: 1px solid var(--line); border-radius: 999px;
  padding: 0.18rem 0.5rem; font-size: 0.72rem; color: var(--muted);
  background: rgba(255,255,255,0.02);
}
.mini-pill b { color: var(--text); font-weight: 650; }
.effect-list {
  margin: 0.15rem 0 0; padding-left: 1.15rem; color: #d5dae6;
  font-size: 0.9rem; line-height: 1.45;
}
.effect-list li { margin: 0.2rem 0; }
.effect-list li::marker { color: var(--accent); }
.conf-map { display: flex; flex-wrap: wrap; gap: 0.35rem; }
.conf-pill {
  border: 1px solid var(--line); border-radius: 999px;
  padding: 0.25rem 0.55rem; font-size: 0.75rem; color: var(--muted);
  background: rgba(255,255,255,0.02);
}
.conf-pill b { color: var(--text); font-weight: 650; }
.unknowns { color: var(--med); }
.skel {
  height: 12px; border-radius: 6px;
  background: linear-gradient(90deg, #171a22, #222733, #171a22);
  background-size: 200% 100%; animation: shimmer 1.1s linear infinite; margin: 0.4rem 0;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.attrib {
  margin-top: 1.25rem; padding-top: 0.85rem; border-top: 1px solid var(--line);
  font-size: 0.72rem; color: var(--faint); line-height: 1.4;
}

@media (prefers-reduced-motion: reduce) {
  .card, .btn, .chip, .card-art img { transition: none; }
  .card:hover { transform: none; }
  .card:hover .card-art img { transform: none; }
  .skel { animation: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <h1>Slot Mechanics</h1>
        <p>Lobby-art catalog of how real games pay, tumble, and unlock bonuses — from official rules, structured for research.</p>
      </div>
      <div class="top-actions">
        <a class="btn ghost" href="https://github.com/stepupgaming/slot-mechanics-dataset" target="_blank" rel="noopener">GitHub</a>
        <a class="btn" href="./dataset.json" target="_blank" rel="noopener">Download JSON</a>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <div class="controls-inner">
      <div class="search-row">
        <input class="field search" id="q" type="search" placeholder="Search titles, providers, slugs…" autocomplete="off" aria-label="Search"/>
        <select class="select" id="confidence" aria-label="Confidence">
          <option value="">Confidence</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select class="select" id="win" aria-label="Win system">
          <option value="">Win system</option>
          <option value="paylines">Paylines</option>
          <option value="ways">Ways</option>
          <option value="pay_anywhere">Pay anywhere</option>
          <option value="clusters">Clusters</option>
          <option value="other">Other</option>
          <option value="unknown">Unknown</option>
        </select>
        <select class="select" id="flag" aria-label="Features">
          <option value="">Features</option>
          <option value="tumble">Tumble</option>
          <option value="buy">Feature buy</option>
          <option value="ante">Ante</option>
        </select>
      </div>
      <div class="providers" id="providers"></div>
    </div>
  </div>

  <main class="stage" id="stage">
    <section>
      <div class="catalog-meta"><span><strong id="shown">0</strong> games</span><span id="hint">Pick a title for the full dossier</span></div>
      <div class="grid" id="grid"><div class="empty">Loading catalog…</div></div>
    </section>
    <aside class="dossier" id="dossier" hidden>
      <div class="dossier-inner" id="detail"></div>
    </aside>
  </main>
</div>

<script>
const CACHE_BUST = '81c93c5';
const state = {
  games: [], filtered: [], selected: null, provider: '',
  cache: new Map(), tab: 'mechanics'
};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]
));
const prettyWin = (t) => ({
  paylines:'Paylines', ways:'Ways', pay_anywhere:'Pay anywhere',
  clusters:'Clusters', other:'Other', unknown:'Unknown'
}[t] || (t || '—'));
const badge = (c) => {
  const x = (c || 'unknown').toLowerCase();
  return `<span class="badge ${x}">${esc(x)}</span>`;
};
const yn = (v) => v === true ? 'Yes' : v === false ? 'No' : '—';
const thumbSrc = (path) => path ? `./${path}?v=${CACHE_BUST}` : '';
const initials = (title) => {
  const parts = String(title || '').trim().split(/\s+/).slice(0, 2);
  return parts.map((p) => p[0] || '').join('').toUpperCase() || '·';
};

function artBlock(path, title, cls) {
  if (path) {
    return `<div class="${cls}"><img src="${esc(thumbSrc(path))}" alt="" loading="lazy" decoding="async" onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','<div class=ph>${esc(initials(title))}</div>')"/></div>`;
  }
  return `<div class="${cls}"><div class="ph">${esc(initials(title))}</div></div>`;
}

function renderStats(idx) {
  const bp = idx.by_provider || {};
  const bc = idx.by_confidence || {};
  const thumbs = idx.thumbnail_count ?? state.games.filter((g) => g.thumbnail).length;
  $('stats').innerHTML = `
    <span><strong>${idx.game_count}</strong> games</span>
    <span><strong>${thumbs}</strong> with art</span>
    <span><strong>${bc.high || 0}</strong> high confidence</span>
    <span><strong>${Object.keys(bp).length}</strong> studios</span>
  `;
  const wrap = $('providers');
  wrap.innerHTML = `<button type="button" class="chip on" data-p="">All studios</button>` +
    Object.entries(bp).sort((a,b)=>b[1]-a[1]).map(([p,n]) =>
      `<button type="button" class="chip" data-p="${esc(p)}">${esc(p)} · ${n}</button>`
    ).join('');
  wrap.querySelectorAll('.chip').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.provider = btn.dataset.p;
      wrap.querySelectorAll('.chip').forEach((b) => b.classList.toggle('on', b.dataset.p === state.provider));
      applyFilters();
    });
  });
}

function applyFilters() {
  const q = $('q').value.trim().toLowerCase();
  const conf = $('confidence').value;
  const win = $('win').value;
  const flag = $('flag').value;
  state.filtered = state.games.filter((g) => {
    if (state.provider && g.provider !== state.provider) return false;
    if (conf && (g.confidence_overall || '').toLowerCase() !== conf) return false;
    if (win && (g.win_system_type || 'unknown') !== win) return false;
    if (flag === 'tumble' && g.has_tumble !== true) return false;
    if (flag === 'buy' && g.has_buy !== true) return false;
    if (flag === 'ante' && g.has_ante !== true) return false;
    if (q) {
      const hay = `${g.title} ${g.slug} ${g.provider}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  renderGrid();
}

function renderGrid() {
  const root = $('grid');
  $('shown').textContent = state.filtered.length;
  if (!state.filtered.length) {
    root.innerHTML = `<div class="empty">No games match those filters.</div>`;
    return;
  }
  root.innerHTML = state.filtered.map((g) => `
    <button type="button" class="card${state.selected===g.slug?' active':''}" data-slug="${esc(g.slug)}">
      <div class="card-art">
        ${g.thumbnail
          ? `<img src="${esc(thumbSrc(g.thumbnail))}" alt="" loading="lazy" decoding="async" onerror="this.remove();this.parentElement.insertAdjacentHTML('beforeend','<div class=ph>${esc(initials(g.title))}</div>')"/>`
          : `<div class="ph">${esc(initials(g.title))}</div>`}
        ${badge(g.confidence_overall)}
      </div>
      <div class="card-body">
        <div class="card-provider">${esc(g.provider)}</div>
        <div class="card-title">${esc(g.title)}</div>
        <div class="tags">
          <span class="tag">${esc(prettyWin(g.win_system_type))}</span>
          ${g.grid ? `<span class="tag">${esc(g.grid)}</span>` : ''}
          ${g.has_tumble ? `<span class="tag">Tumble</span>` : ''}
          ${g.has_buy ? `<span class="tag">Buy</span>` : ''}
          ${g.has_ante ? `<span class="tag">Ante</span>` : ''}
        </div>
      </div>
    </button>
  `).join('');
  root.querySelectorAll('.card').forEach((btn) => {
    btn.addEventListener('click', () => selectGame(btn.dataset.slug));
  });
}

function isBlank(v) {
  return v == null || (typeof v === 'string' && !v.trim());
}

function fmtVal(v) {
  if (v == null) return '';
  if (Array.isArray(v)) return v.map(fmtVal).filter(Boolean).join(', ');
  if (typeof v === 'object') {
    return Object.entries(v).filter(([, y]) => !isBlank(y)).map(([k, y]) => k + ': ' + fmtVal(y)).join(', ');
  }
  return String(v);
}

function kvRows(pairs) {
  const rows = pairs.filter(([, v]) => !isBlank(v));
  if (!rows.length) return '';
  return '<div class="kv-grid">' + rows.map(([k, v]) =>
    '<div class="k">' + esc(k) + '</div><div class="v">' + esc(String(v)) + '</div>'
  ).join('') + '</div>';
}

function paramsPills(params) {
  if (!params || typeof params !== 'object') return '';
  const entries = Object.entries(params).filter(([, v]) => !isBlank(v));
  if (!entries.length) return '';
  return '<div class="pill-row">' + entries.map(([k, v]) =>
    '<span class="mini-pill"><b>' + esc(k) + '</b> ' + esc(fmtVal(v)) + '</span>'
  ).join('') + '</div>';
}

function effectsBlock(text) {
  if (isBlank(text)) return '';
  const parts = String(text).split(/\n+/).map((s) => s.trim()).filter(Boolean);
  if (parts.length <= 1) return '<p class="prose">' + esc(String(text)) + '</p>';
  return '<ul class="effect-list">' + parts.map((p) => '<li>' + esc(p) + '</li>').join('') + '</ul>';
}

function symbolsHTML(symbols) {
  const groups = [
    ['Wilds', symbols.wilds],
    ['Scatters', symbols.scatters],
    ['Multipliers', symbols.multipliers],
    ['Collectors', symbols.collectors],
    ['Specials', symbols.specials],
  ].filter(([, a]) => a && a.length);
  if (!groups.length) return '<p class="prose" style="color:var(--muted)">No symbol rules extracted.</p>';
  return groups.map(([title, arr]) =>
    '<div class="section"><h3>' + esc(title) + '</h3>' +
    arr.map((s) =>
      '<div class="sym"><div class="name">' + esc(s.name || 'Symbol') + '</div>' +
      kvRows([
        ['Pays', s.pays || s.pay],
        ['Substitutes', s.substitutes_for],
      ]) +
      (s.behavior ? '<p class="prose">' + esc(String(s.behavior).slice(0, 2000)) + '</p>' : '') +
      paramsPills(s.params) +
      '</div>'
    ).join('') +
    '</div>'
  ).join('');
}

function modeCard(m) {
  const phases = Array.isArray(m.phases) ? m.phases : [];
  return '<div class="mode-card"><div class="name">' + esc(m.name || 'Bonus mode') + '</div>' +
    kvRows([
      ['Trigger', m.trigger],
      ['Awarded', m.spins_awarded || m.award || m.spins],
      ['Retrigger', m.retrigger],
      ['Sticky / persistent', m.sticky_or_persistent_state],
      ['Progressive state', m.progressive_state],
      ['End condition', m.end_condition],
    ]) +
    effectsBlock(m.effects) +
    (phases.length
      ? '<ul class="phase-list" style="margin-top:.55rem">' + phases.map((p, i) => {
          const title = p.name || ('Phase ' + (i + 1));
          const body = p.what_happens || p.description || '';
          const rules = p.rules || p.state_changes || '';
          return '<li data-n="' + (i + 1) + '"><b>' + esc(title) + '</b>' +
            (body ? ' — ' + esc(body) : '') +
            (rules ? '<div class="v" style="margin-top:.25rem">' + esc(rules) + '</div>' : '') +
            '</li>';
        }).join('') + '</ul>'
      : '') +
    '</div>';
}

function featureCard(f) {
  return '<div class="feat-card"><div class="name">' + esc(f.name || 'Feature') + '</div>' +
    kvRows([
      ['Trigger', f.trigger],
      ['When', f.when || f.timing],
      ['Cost', f.cost_text || (f.cost_multiplier != null ? f.cost_multiplier + '× bet' : null)],
    ]) +
    effectsBlock(f.effects) +
    paramsPills(f.params) +
    '</div>';
}

function buyCard(o) {
  return '<div class="buy-card"><div class="name">' + esc(o.name || 'Buy option') + '</div>' +
    kvRows([
      ['Cost', o.cost_text || (o.cost_multiplier != null ? o.cost_multiplier + '× bet' : null)],
      ['Effects', o.effects],
      ['RTP when bought', o.rtp_when_bought_note],
    ]) +
    '</div>';
}

function loopHTML(loop) {
  if (!loop) return '';
  const phases = loop.phases || loop.steps || [];
  let html = '<div class="section"><h3>Base game loop</h3>';
  if (loop.summary) html += '<p class="prose" style="margin-bottom:.55rem">' + esc(loop.summary) + '</p>';
  if (phases.length) {
    html += '<ul class="phase-list">' + phases.map((p, i) => {
      const title = typeof p === 'string' ? p : (p.name || ('Step ' + (i + 1)));
      const body = typeof p === 'string' ? '' : (p.what_happens || p.description || p.rules || '');
      return '<li data-n="' + (i + 1) + '"><b>' + esc(title) + '</b>' + (body ? ' — ' + esc(body) : '') + '</li>';
    }).join('') + '</ul>';
  }
  if (loop.win_evaluation) {
    html += '<div class="kv-card" style="margin-top:.55rem">' + kvRows([['Win evaluation', loop.win_evaluation]]) + '</div>';
  }
  html += '</div>';
  return html;
}

function limitsHTML(limits) {
  if (!limits || typeof limits !== 'object') return '';
  const rows = [
    ['Max win', limits.max_win_multiplier != null ? limits.max_win_multiplier + '×' : null],
    ['Max win notes', limits.max_win_notes],
    ['RTP', limits.rtp_percent != null ? limits.rtp_percent + '%' : null],
    ['RTP notes', limits.rtp_notes || limits.rtp_note],
    ['Hit frequency', limits.hit_frequency_notes || limits.hit_frequency],
    ['Notes', limits.notes],
  ].filter(([, v]) => !isBlank(v));
  if (!rows.length) return '';
  return '<div class="section"><h3>Limits</h3><div class="kv-card">' + kvRows(rows) + '</div></div>';
}

function tabBody(g) {
  const win = g.win_system || {};
  const reel = g.reel_behavior || {};
  const tumble = reel.cascades_or_tumbles || {};
  const respin = reel.respins || {};
  const expand = reel.expanding_reels || {};
  const fs = g.bonus_free_spins || {};
  const buy = g.feature_buy || {};
  const ante = g.ante_bet || {};
  const conf = g.confidence || {};
  const features = g.features || [];
  const unknowns = g.unknowns || [];
  const evidence = g.evidence || [];
  const limits = g.numeric_limits || {};
  const id = g.identity || {};
  const loop = g.base_game_loop || null;
  const otherReel = reel.other || [];

  if (state.tab === 'symbols') return symbolsHTML(g.symbols || {});

  if (state.tab === 'bonus') {
    const modes = fs.modes || [];
    return (
      '<div class="section"><h3>Free spins / bonus modes</h3>' +
      (modes.length ? modes.map(modeCard).join('') : '<p class="prose" style="color:var(--muted)">No free-spin / bonus modes extracted.</p>') +
      (fs.notes ? '<p class="prose" style="margin-top:.35rem;color:var(--muted)">' + esc(fs.notes) + '</p>' : '') +
      '</div>' +
      '<div class="section"><h3>Named features</h3>' +
      (features.length ? features.map(featureCard).join('') : '<p class="prose" style="color:var(--muted)">No named features extracted.</p>') +
      '</div>' +
      '<div class="section"><h3>Buy &amp; ante</h3>' +
      kvRows([
        ['Feature buy', buy.available === true ? 'Available' : buy.available === false ? 'Not available' : 'Unknown'],
        ['Buy notes', buy.notes],
        ['Ante / extra bet', ante.available === true ? 'Available' : ante.available === false ? 'Not available' : 'Unknown'],
        ['Ante cost', ante.cost_multiplier != null ? ante.cost_multiplier + '× bet' : null],
        ['Ante effects', ante.effects || ante.notes],
      ]) +
      ((buy.options && buy.options.length) ? buy.options.map(buyCard).join('') : '') +
      '</div>'
    );
  }

  if (state.tab === 'sources') {
    return (
      '<div class="section"><h3>Links</h3><div class="dossier-actions" style="margin:0 0 .75rem;padding:0">' +
      (id.official_info_url ? '<a class="btn primary sm" href="' + esc(id.official_info_url) + '" target="_blank" rel="noopener">Official rules</a>' : '') +
      (id.demo_url ? '<a class="btn sm" href="' + esc(id.demo_url) + '" target="_blank" rel="noopener">Demo</a>' : '') +
      (id.slotcatalog_url ? '<a class="btn sm" href="' + esc(id.slotcatalog_url) + '" target="_blank" rel="noopener">SlotCatalog</a>' : '') +
      '<a class="btn sm" href="./games/' + esc(id.slug) + '.json" target="_blank" rel="noopener">Raw JSON</a>' +
      '</div></div>' +
      '<div class="section"><h3>Confidence map</h3><div class="conf-map">' +
      (Object.entries(conf).map(([k, v]) => '<span class="conf-pill"><b>' + esc(k) + '</b> ' + esc(v) + '</span>').join('') || '—') +
      '</div></div>' +
      (unknowns.length
        ? '<div class="section"><h3>Unknowns</h3><ul class="effect-list unknowns">' +
          unknowns.map((u) => '<li>' + esc(u) + '</li>').join('') + '</ul></div>'
        : '') +
      (evidence.length
        ? '<div class="section"><h3>Evidence excerpts</h3>' + evidence.slice(0, 4).map((e) =>
            '<div class="feat-card" style="margin-bottom:.45rem"><p class="prose">' +
            esc(String(e.quote_or_excerpt || e.excerpt || '').slice(0, 900)) +
            '</p><div class="pill-row" style="margin-top:.45rem"><span class="mini-pill"><b>' +
            esc(e.source_type || 'source') + '</b></span>' +
            (e.url ? '<span class="mini-pill">' + esc(e.url) + '</span>' : '') +
            '</div></div>'
          ).join('') + '</div>'
        : '') +
      limitsHTML(limits) +
      '<p class="attrib">Cover art attribution: ' + esc(g.thumbnail_attribution || '—') +
      '. Thumbnails are redistributed lobby/cover stills for catalog browsing; mechanics data is independent.</p>'
    );
  }

  return (
    loopHTML(loop) +
    '<div class="section"><h3>Win system</h3><div class="kv-card">' +
    kvRows([
      ['Type', prettyWin(win.type)],
      ['Paylines', win.payline_count],
      ['Ways', win.ways_count],
      ['Min symbols', win.min_symbols_for_win],
      ['Direction', win.direction],
    ]) +
    (win.notes ? effectsBlock(win.notes) : '') +
    '</div></div>' +
    '<div class="section"><h3>Reel behavior</h3><div class="kv-card">' +
    kvRows([
      ['Tumbles / cascades', tumble.present === true ? 'Yes' : tumble.present === false ? 'No' : 'Unknown'],
      ['How tumbles work', tumble.how_it_works],
      ['Respins', respin.present === true ? 'Yes' : respin.present === false ? 'No' : 'Unknown'],
      ['How respins work', respin.how_it_works],
      ['Expanding reels', expand.present === true ? 'Yes' : expand.present === false ? 'No' : 'Unknown'],
      ['How expanding works', expand.how_it_works],
    ]) +
    (otherReel.length
      ? otherReel.map((o) =>
          '<div class="sym"><div class="name">' + esc(o.name || 'Other') + '</div>' +
          effectsBlock(o.how_it_works || '') + '</div>'
        ).join('')
      : '') +
    '</div></div>' +
    limitsHTML(limits) +
    '<div class="section"><h3>Confidence</h3><div class="conf-map">' +
    Object.entries(conf).map(([k, v]) => '<span class="conf-pill"><b>' + esc(k) + '</b> ' + esc(v) + '</span>').join('') +
    '</div></div>'
  );
}


function renderDetail(g) {
  const id = g.identity || {};
  const win = g.win_system || {};
  const grid = g.grid || {};
  const conf = g.confidence || {};
  const buy = g.feature_buy || {};
  const ante = g.ante_bet || {};
  const reel = g.reel_behavior || {};
  const tumble = reel.cascades_or_tumbles || {};
  const respin = reel.respins || {};
  const gridLabel = (grid.rows && grid.cols) ? `${grid.rows}×${grid.cols}` : '—';
  const winHint = win.payline_count != null ? `${win.payline_count} lines`
    : win.ways_count != null ? `${win.ways_count} ways`
    : win.min_symbols_for_win != null ? `min ${win.min_symbols_for_win}`
    : (win.direction || '—');

  $('dossier').hidden = false;
  $('stage').classList.add('split');
  $('hint').textContent = 'Dossier open';

  $('detail').innerHTML = `
    ${g.thumbnail
      ? `<div class="dossier-hero"><img src="${esc(thumbSrc(g.thumbnail))}" alt=""/></div>`
      : `<div class="dossier-hero"><div class="ph">${esc(initials(id.title))}</div></div>`}
    <div class="dossier-head">
      <div>
        <h2 class="dossier-title">${esc(id.title || 'Untitled')}</h2>
        <div class="dossier-meta">
          <span>${esc(id.provider || '')}</span>
          ${badge(conf.overall || 'unknown')}
          <span class="slug">${esc(id.slug || '')}</span>
        </div>
      </div>
    </div>
    <div class="dossier-actions">
      ${id.official_info_url ? `<a class="btn primary sm" href="${esc(id.official_info_url)}" target="_blank" rel="noopener">Official rules</a>` : ''}
      <a class="btn sm" href="./games/${esc(id.slug)}.json" target="_blank" rel="noopener">Raw JSON</a>
    </div>

    <div class="dossier-pad">
      <div class="glance">
        <div class="glance-item"><div class="lab">Grid</div><div class="val">${esc(gridLabel)}</div><div class="hint">${esc((grid.layout_notes||'').slice(0,60) || 'From rules')}</div></div>
        <div class="glance-item"><div class="lab">Win system</div><div class="val">${esc(prettyWin(win.type))}</div><div class="hint">${esc(winHint)}</div></div>
        <div class="glance-item"><div class="lab">Reels</div><div class="val">${tumble.present?'Tumbles':respin.present?'Respins':'Standard'}</div><div class="hint">Tumble ${yn(tumble.present)} · Respin ${yn(respin.present)}</div></div>
        <div class="glance-item"><div class="lab">Buy / ante</div><div class="val">${buy.available?'Buy on':ante.available?'Ante on':'None listed'}</div><div class="hint">Buy ${yn(buy.available)} · Ante ${yn(ante.available)}${ante.cost_multiplier!=null?' · '+esc(ante.cost_multiplier)+'x':''}</div></div>
      </div>

      <div class="tabs" role="tablist">
        <button type="button" class="tab${state.tab==='mechanics'?' on':''}" data-tab="mechanics">Mechanics</button>
        <button type="button" class="tab${state.tab==='symbols'?' on':''}" data-tab="symbols">Symbols</button>
        <button type="button" class="tab${state.tab==='bonus'?' on':''}" data-tab="bonus">Bonus</button>
        <button type="button" class="tab${state.tab==='sources'?' on':''}" data-tab="sources">Sources</button>
      </div>
      <div id="tab-body">${tabBody(g)}</div>
    </div>
  `;

  $('detail').querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      state.tab = btn.dataset.tab;
      const cached = state.cache.get(state.selected);
      if (cached) renderDetail(cached);
    });
  });
}

async function selectGame(slug) {
  state.selected = slug;
  state.tab = 'mechanics';
  renderGrid();
  $('detail').innerHTML = `<div class="dossier-pad" style="padding-top:1.15rem"><div class="skel" style="width:55%"></div><div class="skel" style="width:80%"></div><div class="skel" style="height:88px;width:100%;margin-top:1rem"></div></div>`;
  $('dossier').hidden = false;
  $('stage').classList.add('split');
  try {
    let g = state.cache.get(slug);
    if (!g) {
      const res = await fetch(`./games/${encodeURIComponent(slug)}.json?v=${CACHE_BUST}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      g = await res.json();
      state.cache.set(slug, g);
    }
    renderDetail(g);
    history.replaceState(null, '', `#${encodeURIComponent(slug)}`);
    $('dossier').scrollTop = 0;
  } catch (err) {
    $('detail').innerHTML = `<div class="empty err">Couldn’t load ${esc(slug)}. ${esc(err.message)}</div>`;
  }
}

async function boot() {
  const res = await fetch(`./dataset.json?v=${CACHE_BUST}`);
  if (!res.ok) throw new Error(`dataset.json HTTP ${res.status}`);
  const idx = await res.json();
  state.games = idx.games || [];
  renderStats(idx);
  applyFilters();
  const hash = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  if (hash && state.games.some((g) => g.slug === hash)) selectGame(hash);
}

['q','confidence','win','flag'].forEach((id) => {
  $(id).addEventListener('input', applyFilters);
  $(id).addEventListener('change', applyFilters);
});
window.addEventListener('keydown', (e) => {
  if (e.target && ['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); $('q').focus();
  }
});

boot().catch((err) => {
  $('grid').innerHTML = `<div class="empty err">${esc(err.message)}</div>`;
});
</script>
</body>
</html>
