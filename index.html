<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Slot Mechanics</title>
<meta name="description" content="Look up how real slot games work — grids, win systems, tumbles, free spins, feature buys."/>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --panel: #ffffff;
  --ink: #111318;
  --muted: #5c6370;
  --faint: #8b919c;
  --line: #e4e6eb;
  --line-strong: #d0d3db;
  --accent: #2563eb;
  --accent-soft: #eff4ff;
  --accent-hover: #1d4ed8;
  --high: #0f7b4c;
  --high-bg: #e8f6ef;
  --med: #9a6700;
  --med-bg: #faf0d7;
  --low: #b42318;
  --low-bg: #fcebea;
  --focus: 0 0 0 2px #fff, 0 0 0 4px var(--accent);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --toolbar-h: 56px;
  --filter-h: 52px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
::selection { background: #dbe7ff; color: var(--ink); }
:focus-visible { outline: none; box-shadow: var(--focus); }

.app {
  height: 100vh;
  display: grid;
  grid-template-rows: var(--toolbar-h) var(--filter-h) 1fr;
}

/* —— Toolbar —— */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: 0 1.25rem;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 0.65rem;
  min-width: 0;
}
.brand h1 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.brand .count {
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.toolbar-links {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.toolbar-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
}
.toolbar-links a:hover { color: var(--ink); }

/* —— Filters —— */
.filters {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0 1.25rem;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.field, .select {
  height: 34px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  font: 500 13px/1 var(--font);
  padding: 0 0.65rem;
}
.field { min-width: 220px; flex: 1 1 220px; }
.field::placeholder { color: var(--faint); }
.field:hover, .select:hover { border-color: #b8bdc8; }
.select { cursor: pointer; padding-right: 1.75rem; }
.sep {
  width: 1px; height: 20px; background: var(--line); margin: 0 0.15rem; flex: 0 0 auto;
}

/* —— Main split —— */
.main {
  display: grid;
  grid-template-columns: minmax(280px, 340px) 1fr;
  min-height: 0;
}
@media (max-width: 860px) {
  .app { height: auto; min-height: 100vh; }
  .main { grid-template-columns: 1fr; }
  #game-list { max-height: 42vh; }
}

.list-pane, .detail-pane {
  min-height: 0;
  background: var(--panel);
  display: flex;
  flex-direction: column;
}
.list-pane { border-right: 1px solid var(--line); }
.pane-meta {
  padding: 0.55rem 1rem;
  font-size: 12px;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  gap: 0.5rem;
}

#game-list {
  overflow: auto;
  flex: 1;
  scrollbar-width: thin;
  scrollbar-color: #c5c9d2 transparent;
}
.row {
  width: 100%;
  text-align: left;
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
  color: inherit;
  padding: 0.7rem 1rem;
  cursor: pointer;
  display: grid;
  gap: 0.2rem;
  transition: background 160ms ease;
}
.row:hover { background: #f8f9fb; }
.row.active {
  background: var(--accent-soft);
}
.row.active .row-title { color: var(--accent-hover); }
.row-title {
  font-size: 13.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  line-height: 1.3;
}
.row-sub {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem;
  font-size: 12px;
  color: var(--muted);
}
.dot { width: 3px; height: 3px; border-radius: 50%; background: #c0c4ce; }

.badge {
  display: inline-flex;
  align-items: center;
  font-size: 10px;
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border-radius: 4px;
  padding: 0.12rem 0.35rem;
}
.badge.high { color: var(--high); background: var(--high-bg); }
.badge.medium { color: var(--med); background: var(--med-bg); }
.badge.low { color: var(--low); background: var(--low-bg); }

#detail {
  overflow: auto;
  flex: 1;
  padding: 1.35rem 1.5rem 2.5rem;
  scrollbar-width: thin;
  scrollbar-color: #c5c9d2 transparent;
}
.empty {
  color: var(--muted);
  padding: 2.5rem 1rem;
  text-align: center;
}
.err { color: var(--low); }

.detail-top {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.85rem 1.25rem;
  align-items: flex-start;
  margin-bottom: 1.25rem;
  padding-bottom: 1.1rem;
  border-bottom: 1px solid var(--line);
}
.detail-title {
  margin: 0;
  font-size: 28px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.detail-sub {
  margin: 0.4rem 0 0;
  color: var(--muted);
  font-size: 13px;
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  align-items: center;
}
.slug {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--faint);
}
.actions { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.btn {
  display: inline-flex;
  align-items: center;
  height: 34px;
  padding: 0 0.8rem;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: var(--panel);
  color: var(--ink);
  text-decoration: none;
  font-size: 13px;
  font-weight: 550;
  transition: background 150ms ease, border-color 150ms ease;
}
.btn:hover { background: #f8f9fb; border-color: #b8bdc8; }
.btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

.facts {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 1.5rem;
  overflow: hidden;
}
@media (max-width: 720px) {
  .facts { grid-template-columns: 1fr 1fr; }
  .detail-title { font-size: 22px; }
}
.fact {
  padding: 0.85rem 1rem;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.facts .fact:nth-child(4n) { border-right: 0; }
@media (max-width: 720px) {
  .facts .fact:nth-child(2n) { border-right: 0; }
}
.fact .lab {
  font-size: 11px;
  font-weight: 600;
  color: var(--faint);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 0.3rem;
}
.fact .val {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.015em;
}
.fact .hint {
  margin-top: 0.15rem;
  font-size: 12px;
  color: var(--muted);
}

.section {
  margin: 0 0 1.35rem;
  max-width: 78ch;
}
.section h2 {
  margin: 0 0 0.55rem;
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--faint);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.section h2 .badge { text-transform: uppercase; }
.prose {
  margin: 0;
  color: var(--ink);
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-wrap;
}
.quote {
  margin: 0;
  padding: 0.75rem 0.85rem;
  background: #f8f9fb;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.5;
  color: #2a303c;
  white-space: pre-wrap;
  max-height: 240px;
  overflow: auto;
}
.sym { padding: 0.65rem 0; border-top: 1px solid var(--line); }
.sym:first-of-type { border-top: 0; padding-top: 0; }
.sym .name { font-weight: 600; margin-bottom: 0.25rem; }
.conf-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem 0.85rem;
  font-size: 13px;
  color: var(--muted);
}
.conf-list b { color: var(--ink); font-weight: 600; }
.unknowns { color: var(--med); }
.cols {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr;
  gap: 1.5rem;
  align-items: start;
}
@media (max-width: 980px) { .cols { grid-template-columns: 1fr; } }

.skel {
  height: 12px;
  border-radius: 4px;
  background: linear-gradient(90deg, #eceef2, #f6f7f9, #eceef2);
  background-size: 200% 100%;
  animation: shimmer 1.1s linear infinite;
  margin: 0.45rem 0;
}
@keyframes shimmer { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="app">
  <header class="toolbar">
    <div class="brand">
      <h1>Slot Mechanics</h1>
      <span class="count" id="total-count">—</span>
    </div>
    <div class="toolbar-links">
      <a href="https://github.com/stepupgaming/slot-mechanics-dataset" target="_blank" rel="noopener">GitHub</a>
      <a href="./dataset.json" target="_blank" rel="noopener">dataset.json</a>
    </div>
  </header>

  <div class="filters" role="search">
    <input class="field" id="q" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games"/>
    <span class="sep" aria-hidden="true"></span>
    <select class="select" id="provider" aria-label="Provider"><option value="">All providers</option></select>
    <select class="select" id="confidence" aria-label="Confidence">
      <option value="">Any confidence</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
    <select class="select" id="win" aria-label="Win system">
      <option value="">Any win system</option>
      <option value="paylines">Paylines</option>
      <option value="ways">Ways</option>
      <option value="pay_anywhere">Pay anywhere</option>
      <option value="clusters">Clusters</option>
      <option value="other">Other</option>
      <option value="unknown">Unknown</option>
    </select>
    <select class="select" id="flag" aria-label="Feature flag">
      <option value="">Any features</option>
      <option value="tumble">Tumble</option>
      <option value="buy">Feature buy</option>
      <option value="ante">Ante</option>
    </select>
  </div>

  <div class="main">
    <aside class="list-pane">
      <div class="pane-meta"><span id="list-count">0 shown</span><span>↑↓</span></div>
      <div id="game-list"><div class="empty">Loading…</div></div>
    </aside>
    <section class="detail-pane" aria-live="polite">
      <div class="pane-meta"><span>Detail</span><span id="detail-status"></span></div>
      <div id="detail"><div class="empty">Select a game.</div></div>
    </section>
  </div>
</div>

<script>
const state = { games: [], filtered: [], selected: null, cache: new Map() };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]
));
const prettyWin = (t) => ({
  paylines: 'Paylines', ways: 'Ways', pay_anywhere: 'Pay anywhere',
  clusters: 'Clusters', other: 'Other', unknown: 'Unknown'
}[t] || (t || '—'));
const badge = (c) => {
  const x = (c || 'unknown').toLowerCase();
  return `<span class="badge ${x}">${esc(x)}</span>`;
};
const yn = (v) => v === true ? 'Yes' : v === false ? 'No' : '—';

function fillProviders(by) {
  const sel = $('provider');
  Object.entries(by || {}).sort((a,b) => b[1]-a[1]).forEach(([p, n]) => {
    const o = document.createElement('option');
    o.value = p;
    o.textContent = `${p} (${n})`;
    sel.appendChild(o);
  });
}

function applyFilters() {
  const q = $('q').value.trim().toLowerCase();
  const provider = $('provider').value;
  const conf = $('confidence').value;
  const win = $('win').value;
  const flag = $('flag').value;
  state.filtered = state.games.filter((g) => {
    if (provider && g.provider !== provider) return false;
    if (conf && (g.confidence_overall || '').toLowerCase() !== conf) return false;
    if (win && (g.win_system_type || 'unknown') !== win) return false;
    if (flag === 'tumble' && g.has_tumble !== true) return false;
    if (flag === 'buy' && g.has_buy !== true) return false;
    if (flag === 'ante' && g.has_ante !== true) return false;
    if (q) {
      const hay = `${g.title} ${g.slug} ${g.provider}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  renderList();
}

function renderList() {
  const root = $('game-list');
  $('list-count').textContent = `${state.filtered.length} shown`;
  if (!state.filtered.length) {
    root.innerHTML = `<div class="empty">No games match.</div>`;
    return;
  }
  root.innerHTML = state.filtered.map((g) => `
    <button type="button" class="row${state.selected === g.slug ? ' active' : ''}" data-slug="${esc(g.slug)}">
      <div class="row-title">${esc(g.title)}</div>
      <div class="row-sub">
        <span>${esc(g.provider)}</span>
        <span class="dot"></span>
        <span>${esc(prettyWin(g.win_system_type))}</span>
        ${g.grid ? `<span class="dot"></span><span>${esc(g.grid)}</span>` : ''}
        <span class="dot"></span>
        ${badge(g.confidence_overall)}
      </div>
    </button>
  `).join('');
  root.querySelectorAll('.row').forEach((btn) => {
    btn.addEventListener('click', () => selectGame(btn.dataset.slug));
  });
  const active = root.querySelector('.row.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

function symbolsHTML(symbols) {
  const groups = [
    ['Wilds', symbols.wilds],
    ['Scatters', symbols.scatters],
    ['Multipliers', symbols.multipliers],
    ['Collectors', symbols.collectors],
    ['Specials', symbols.specials],
  ].filter(([, a]) => a && a.length);
  return groups.map(([title, arr]) => `
    <section class="section">
      <h2>${esc(title)}</h2>
      ${arr.map((s) => `
        <div class="sym">
          <div class="name">${esc(s.name || 'Symbol')}</div>
          <p class="prose">${esc((s.behavior || '').slice(0, 1800) || '—')}</p>
        </div>
      `).join('')}
    </section>
  `).join('');
}

function renderDetail(g) {
  const id = g.identity || {};
  const win = g.win_system || {};
  const grid = g.grid || {};
  const conf = g.confidence || {};
  const buy = g.feature_buy || {};
  const ante = g.ante_bet || {};
  const reel = g.reel_behavior || {};
  const fs = g.bonus_free_spins || {};
  const tumble = reel.cascades_or_tumbles || {};
  const respin = reel.respins || {};
  const features = g.features || [];
  const unknowns = g.unknowns || [];
  const evidence = g.evidence || [];
  const limits = g.numeric_limits || {};

  const gridLabel = (grid.rows && grid.cols)
    ? `${grid.rows}×${grid.cols}`
    : '—';
  const winHint = win.payline_count != null ? `${win.payline_count} lines`
    : win.ways_count != null ? `${win.ways_count} ways`
    : win.min_symbols_for_win != null ? `min ${win.min_symbols_for_win}`
    : (win.direction || '');

  $('detail').innerHTML = `
    <div class="detail-top">
      <div>
        <h2 class="detail-title">${esc(id.title || 'Untitled')}</h2>
        <p class="detail-sub">
          <span>${esc(id.provider || '')}</span>
          ${badge(conf.overall || 'unknown')}
          <span class="slug">${esc(id.slug || '')}</span>
        </p>
      </div>
      <div class="actions">
        ${id.official_info_url ? `<a class="btn primary" href="${esc(id.official_info_url)}" target="_blank" rel="noopener">Official rules</a>` : ''}
        ${id.demo_url ? `<a class="btn" href="${esc(id.demo_url)}" target="_blank" rel="noopener">Demo</a>` : ''}
        ${id.slotcatalog_url ? `<a class="btn" href="${esc(id.slotcatalog_url)}" target="_blank" rel="noopener">SlotCatalog</a>` : ''}
        <a class="btn" href="./games/${esc(id.slug)}.json" target="_blank" rel="noopener">Raw JSON</a>
      </div>
    </div>

    <div class="facts" role="group" aria-label="Key mechanics">
      <div class="fact"><div class="lab">Grid</div><div class="val">${esc(gridLabel)}</div><div class="hint">${esc(grid.layout_notes || 'From rules')}</div></div>
      <div class="fact"><div class="lab">Win system</div><div class="val">${esc(prettyWin(win.type))}</div><div class="hint">${esc(winHint || '—')}</div></div>
      <div class="fact"><div class="lab">Reel behavior</div><div class="val">${tumble.present ? 'Tumbles' : respin.present ? 'Respins' : 'Standard'}</div><div class="hint">Tumble ${yn(tumble.present)} · Respin ${yn(respin.present)}</div></div>
      <div class="fact"><div class="lab">Buy / ante</div><div class="val">${buy.available ? 'Buy available' : ante.available ? 'Ante available' : 'None listed'}</div><div class="hint">Buy ${yn(buy.available)} · Ante ${yn(ante.available)}${ante.cost_multiplier != null ? ' · ' + esc(ante.cost_multiplier) + 'x' : ''}</div></div>
    </div>

    <div class="cols">
      <div>
        ${win.notes ? `<section class="section"><h2>Win system ${badge(conf.win_system || '')}</h2><pre class="quote">${esc(win.notes)}</pre></section>` : ''}
        ${tumble.how_it_works ? `<section class="section"><h2>Tumble / cascade</h2><pre class="quote">${esc(tumble.how_it_works)}</pre></section>` : ''}
        ${(fs.notes || (fs.modes && fs.modes.length)) ? `<section class="section"><h2>Free spins / bonus ${badge(conf.bonus_free_spins || '')}</h2>${fs.notes ? `<pre class="quote">${esc(fs.notes)}</pre>` : ''}${fs.modes && fs.modes.length ? `<pre class="quote" style="margin-top:.5rem">${esc(JSON.stringify(fs.modes, null, 2))}</pre>` : ''}</section>` : ''}
        ${features.length ? `<section class="section"><h2>Features</h2><pre class="quote">${esc(JSON.stringify(features, null, 2))}</pre></section>` : ''}
        ${(buy.notes || (buy.options && buy.options.length) || ante.notes) ? `<section class="section"><h2>Feature buy &amp; ante</h2>${buy.notes ? `<p class="prose" style="margin-bottom:.5rem">${esc(buy.notes)}</p>` : ''}${buy.options && buy.options.length ? `<pre class="quote">${esc(JSON.stringify(buy.options, null, 2))}</pre>` : ''}${ante.notes ? `<p class="prose" style="margin-top:.5rem">${esc(ante.notes)}</p>` : ''}</section>` : ''}
      </div>
      <div>
        ${symbolsHTML(g.symbols || {})}
        <section class="section">
          <h2>Confidence</h2>
          <div class="conf-list">${Object.entries(conf).map(([k,v]) => `<span><b>${esc(k)}</b> ${esc(v)}</span>`).join('') || '—'}</div>
        </section>
        ${(limits.max_win_multiplier != null || limits.rtp_note || limits.notes) ? `<section class="section"><h2>Limits</h2><pre class="quote">${esc(JSON.stringify(limits, null, 2))}</pre></section>` : ''}
        ${unknowns.length ? `<section class="section"><h2>Unknowns</h2><p class="prose unknowns">${unknowns.map((u) => '• ' + esc(u)).join('\n')}</p></section>` : ''}
        ${evidence.length ? `<section class="section"><h2>Evidence</h2>${evidence.slice(0,3).map((e) => `<pre class="quote" style="margin-bottom:.45rem">${esc((e.quote_or_excerpt || e.excerpt || '').slice(0,900))}\n\n— ${esc(e.source_type || '')}${e.url ? ' · ' + esc(e.url) : ''}</pre>`).join('')}</section>` : ''}
      </div>
    </div>
  `;
}

async function selectGame(slug) {
  if (!slug) return;
  state.selected = slug;
  renderList();
  $('detail-status').textContent = 'Loading';
  $('detail').innerHTML = `<div style="max-width:40ch"><div class="skel" style="width:45%"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:58%"></div><div class="skel" style="height:72px;width:100%;margin-top:1rem"></div></div>`;
  try {
    let g = state.cache.get(slug);
    if (!g) {
      const res = await fetch(`./games/${encodeURIComponent(slug)}.json`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      g = await res.json();
      state.cache.set(slug, g);
    }
    $('detail-status').textContent = '';
    renderDetail(g);
    history.replaceState(null, '', `#${encodeURIComponent(slug)}`);
  } catch (err) {
    $('detail-status').textContent = 'Error';
    $('detail').innerHTML = `<div class="empty err">Couldn’t load ${esc(slug)}. ${esc(err.message)}</div>`;
  }
}

function moveSelection(delta) {
  if (!state.filtered.length) return;
  let i = state.filtered.findIndex((g) => g.slug === state.selected);
  if (i < 0) i = 0;
  const next = state.filtered[(i + delta + state.filtered.length) % state.filtered.length];
  selectGame(next.slug);
}

async function boot() {
  const res = await fetch('./dataset.json');
  if (!res.ok) throw new Error(`dataset.json HTTP ${res.status}`);
  const idx = await res.json();
  state.games = idx.games || [];
  $('total-count').textContent = `${idx.game_count} games`;
  fillProviders(idx.by_provider);
  applyFilters();
  const hash = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  if (hash && state.games.some((g) => g.slug === hash)) selectGame(hash);
  else if (state.filtered[0]) selectGame(state.filtered[0].slug);
}

['q','provider','confidence','win','flag'].forEach((id) => {
  $(id).addEventListener('input', applyFilters);
  $(id).addEventListener('change', applyFilters);
});
window.addEventListener('keydown', (e) => {
  if (e.target && ['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); moveSelection(1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); moveSelection(-1); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    $('q').focus();
  }
});

boot().catch((err) => {
  $('game-list').innerHTML = `<div class="empty err">${esc(err.message)}</div>`;
});
</script>
</body>
</html>
